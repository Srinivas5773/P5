<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wishlist | Srinivas Ecommerce</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="container">
      <div class="navbar">
        <a href="index.html" class="logo">
          <div class="logo-icon"><i class="bi bi-bag-heart-fill"></i></div>
          <span>Srinivas<span style="color:var(--text-main);">Store</span></span>
        </a>

        <div class="nav-actions">
          <button id="theme-toggle" class="theme-toggle-btn" title="Toggle Theme">
            <i class="bi bi-moon-fill"></i>
          </button>
          <a href="cart.html" class="action-btn">
            <i class="bi bi-cart3"></i>
            <span>Cart</span>
            <span id="cart-badge" class="badge" style="display:none;">0</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top:2rem;">
    <h1 style="font-size:1.8rem; font-weight:800; margin-bottom:1.5rem; color:var(--text-main);"><i class="bi bi-heart-fill" style="color:var(--danger);"></i> Saved Wishlist</h1>

    <div id="wishlist-products-grid" class="products-grid">
      <!-- Rendered by inline script -->
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderWishlist();
    });

    function renderWishlist() {
      const container = document.getElementById('wishlist-products-grid');
      const wishlist = store.getWishlist();
      const products = store.getProducts().filter(p => wishlist.includes(p.id));

      if (products.length === 0) {
        container.innerHTML = `
          <div style="grid-column:1/-1; text-align:center; padding:4rem 1rem; background-color:var(--bg-surface); border:1px solid var(--border-color); border-radius:var(--radius-lg);">
            <i class="bi bi-heart" style="font-size:3.5rem; color:var(--text-muted);"></i>
            <h3 style="margin-top:1rem; font-weight:800; color:var(--text-main);">Your Wishlist is Empty</h3>
            <p style="color:var(--text-muted); margin-bottom:1.5rem;">Save your favorite Fashion, Mobiles, Furniture or Groceries items here!</p>
            <a href="shop.html" class="btn-checkout" style="max-width:220px; margin:0 auto;">Explore Catalog</a>
          </div>
        `;
        return;
      }

      container.innerHTML = products.map(product => `
        <div class="product-card">
          <div class="product-img-wrap">
            <button class="btn-action-icon active" style="position:absolute; top:12px; right:12px;" onclick="removeFromWishlist('${product.id}')" title="Remove">
              <i class="bi bi-trash-fill"></i>
            </button>
            <img src="${product.image}" alt="${product.name}" />
          </div>
          <div class="product-content">
            <div class="product-cat">${product.category.toUpperCase()} • ${product.brand}</div>
            <h3 class="product-title">${product.name}</h3>
            <div class="product-price-row">
              <span class="price-current">₹${product.price.toLocaleString()}</span>
              ${product.originalPrice ? `<span class="price-old">₹${product.originalPrice.toLocaleString()}</span>` : ''}
            </div>
            <button class="btn-add-cart" onclick="store.addToCart('${product.id}')">
              <i class="bi bi-cart-plus-fill"></i> Move to Cart
            </button>
          </div>
        </div>
      `).join('');
    }

    function removeFromWishlist(productId) {
      store.toggleWishlist(productId);
      renderWishlist();
    }
  </script>

  <!-- Three.js 3D Library & Srinivas 3D Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/3d-engine.js"></script>
</body>

</html>
