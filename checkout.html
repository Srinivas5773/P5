<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Srinivas Ecommerce</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="container">
      <div class="navbar">
        <a href="index.html" class="logo">
          <div class="logo-icon"><i class="bi bi-bag-heart-fill"></i></div>
          <span>Srinivas<span style="color:var(--text-main);">Store</span></span>
        </a>
        <div style="font-weight:700; color:var(--success); font-size:0.9rem;"><i class="bi bi-shield-lock-fill"></i> Secure SSL Checkout</div>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Stepper Header -->
    <div class="checkout-stepper">
      <div class="step-item">
        <div class="step-number">1</div>
        <span>Cart</span>
      </div>
      <div style="width:50px; height:2px; background:var(--primary);"></div>
      <div class="step-item active">
        <div class="step-number">2</div>
        <span>Shipping & Payment</span>
      </div>
      <div style="width:50px; height:2px; background:var(--border-color);"></div>
      <div class="step-item">
        <div class="step-number">3</div>
        <span>Confirmation</span>
      </div>
    </div>

    <!-- Checkout Grid -->
    <form id="checkout-form" class="cart-grid" style="grid-template-columns: 1fr 380px;">
      
      <!-- Shipping & Payment Form Section -->
      <div style="background-color:var(--bg-surface); border:1px solid var(--border-color); border-radius:var(--radius-lg); padding:2rem; box-shadow:var(--shadow-sm);">
        <h3 style="font-size:1.25rem; font-weight:800; margin-bottom:1.5rem; color:var(--text-main); display:flex; align-items:center; gap:0.6rem;">
          <i class="bi bi-geo-alt-fill" style="color:var(--primary);"></i> Shipping Address
        </h3>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
          <div class="form-group">
            <label class="form-label">Full Name *</label>
            <input type="text" id="cust-name" class="form-input" required placeholder="e.g. Srinivas Rao">
          </div>
          <div class="form-group">
            <label class="form-label">Phone Number *</label>
            <input type="tel" id="cust-phone" class="form-input" required placeholder="e.g. +91 9876543210">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Street Address *</label>
          <input type="text" id="cust-address" class="form-input" required placeholder="Flat No., House/Building, Street Area">
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
          <div class="form-group">
            <label class="form-label">City / Town *</label>
            <input type="text" id="cust-city" class="form-input" required placeholder="Hyderabad">
          </div>
          <div class="form-group">
            <label class="form-label">PIN Code *</label>
            <input type="text" id="cust-pincode" class="form-input" required placeholder="500001">
          </div>
        </div>

        <h3 style="font-size:1.25rem; font-weight:800; margin:2rem 0 1.25rem; color:var(--text-main); display:flex; align-items:center; gap:0.6rem;">
          <i class="bi bi-credit-card-fill" style="color:var(--primary);"></i> Payment Options
        </h3>

        <div style="display:flex; flex-direction:column; gap:1rem; margin-bottom:1.5rem;">
          <label class="checkbox-label" style="background:var(--bg-subtle); padding:1rem; border-radius:var(--radius-md); border:1px solid var(--border-color);">
            <input type="radio" name="payment-mode" value="upi" checked />
            <span style="font-weight:700; color:var(--text-main);">UPI (Google Pay, PhonePe, Paytm)</span>
          </label>
          <label class="checkbox-label" style="background:var(--bg-subtle); padding:1rem; border-radius:var(--radius-md); border:1px solid var(--border-color);">
            <input type="radio" name="payment-mode" value="card" />
            <span style="font-weight:700; color:var(--text-main);">Credit / Debit Card</span>
          </label>
          <label class="checkbox-label" style="background:var(--bg-subtle); padding:1rem; border-radius:var(--radius-md); border:1px solid var(--border-color);">
            <input type="radio" name="payment-mode" value="cod" />
            <span style="font-weight:700; color:var(--text-main);">Cash on Delivery (COD)</span>
          </label>
        </div>

        <!-- Tab Content Preview -->
        <div id="payment-tab-upi" class="payment-tab-content" style="background:var(--primary-light); padding:1rem; border-radius:var(--radius-md); font-size:0.85rem; color:var(--primary); font-weight:600; margin-bottom:1.5rem;">
          <i class="bi bi-info-circle-fill"></i> Instant UPI QR code or VPA request will be generated upon order placement.
        </div>

        <button type="submit" class="btn-checkout" style="font-size:1.1rem; padding:1rem;">Place Order Now <i class="bi bi-check-circle-fill"></i></button>
      </div>

      <!-- Right Column: Order Items Summary -->
      <div class="cart-summary-card">
        <h3 style="font-size:1.2rem; font-weight:800; margin-bottom:1.2rem; color:var(--text-main);">Order Items</h3>
        <div id="checkout-items-summary" style="border-bottom:1px solid var(--border-color); padding-bottom:1rem; margin-bottom:1rem;">
          <!-- Rendered by checkout.js -->
        </div>
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="checkout-subtotal">₹0</span>
        </div>
        <div class="summary-total summary-row">
          <span>Amount Payable</span>
          <span id="checkout-grandtotal">₹0</span>
        </div>
      </div>

    </form>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/checkout.js"></script>

  <!-- Three.js 3D Library & Srinivas 3D Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/3d-engine.js"></script>
</body>

</html>
