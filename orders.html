<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders | Srinivas Ecommerce</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="header">
    <div class="container">
      <div class="navbar">
        <a href="index.html" class="logo">
          <div class="logo-icon"><i class="bi bi-bag-heart-fill"></i></div>
          <span>Srinivas<span style="color:var(--text-main);">Store</span></span>
        </a>

        <div class="nav-actions">
          <button id="theme-toggle" class="theme-toggle-btn" title="Toggle Theme">
            <i class="bi bi-moon-fill"></i>
          </button>
          <a href="cart.html" class="action-btn">
            <i class="bi bi-cart3"></i>
            <span>Cart</span>
            <span id="cart-badge" class="badge" style="display:none;">0</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top:2rem; max-width:800px;">
    <h1 style="font-size:1.8rem; font-weight:800; margin-bottom:1.5rem; color:var(--text-main);"><i class="bi bi-box-seam-fill" style="color:var(--primary);"></i> Order History & Tracking</h1>

    <div id="orders-list">
      <!-- Rendered by checkout.js -->
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/checkout.js"></script>

  <!-- Three.js 3D Library & Srinivas 3D Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/3d-engine.js"></script>
</body>

</html>
