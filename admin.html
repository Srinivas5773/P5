<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Srinivas Ecommerce</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="container">
      <div class="navbar">
        <a href="index.html" class="logo">
          <div class="logo-icon"><i class="bi bi-speedometer2"></i></div>
          <span>Srinivas<span style="color:var(--text-main);">Admin</span></span>
        </a>

        <div style="display:flex; align-items:center; gap:1rem;">
          <button id="reset-store-data" class="btn-filter-reset" style="border-color:var(--danger); color:var(--danger);">
            <i class="bi bi-arrow-counterclockwise"></i> Reset Mock Data
          </button>
          <a href="index.html" class="btn-filter-reset" style="background:var(--primary); color:white; border:none;">
            <i class="bi bi-shop"></i> View Storefront
          </a>
        </div>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top:2rem;">
    <h1 style="font-size:1.8rem; font-weight:800; margin-bottom:1.5rem; color:var(--text-main);">Admin Store Management</h1>

    <!-- 4 Stats Cards -->
    <div class="admin-stats-grid">
      <div class="stat-card">
        <div class="stat-icon" style="background:rgba(37,99,235,0.15); color:var(--primary);"><i class="bi bi-currency-rupee"></i></div>
        <div>
          <div id="stat-total-sales" class="stat-val">₹0</div>
          <div class="stat-lbl">Total Gross Revenue</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:rgba(16,185,129,0.15); color:var(--success);"><i class="bi bi-bag-check-fill"></i></div>
        <div>
          <div id="stat-total-orders" class="stat-val">0</div>
          <div class="stat-lbl">Total Orders Placed</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:rgba(245,158,11,0.15); color:var(--accent);"><i class="bi bi-box-seam-fill"></i></div>
        <div>
          <div id="stat-total-products" class="stat-val">0</div>
          <div class="stat-lbl">Active Products</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:rgba(239,68,68,0.15); color:var(--danger);"><i class="bi bi-layers-fill"></i></div>
        <div>
          <div id="stat-total-stock" class="stat-val">0</div>
          <div class="stat-lbl">Total Units in Stock</div>
        </div>
      </div>
    </div>

    <!-- Layout: Add Product Form + Inventory Table -->
    <div class="cart-grid" style="grid-template-columns: 340px 1fr;">
      
      <!-- Add Product Form -->
      <div style="background-color:var(--bg-surface); border:1px solid var(--border-color); border-radius:var(--radius-md); padding:1.5rem; height:fit-content; box-shadow:var(--shadow-sm);">
        <h3 style="font-size:1.15rem; font-weight:800; margin-bottom:1.25rem; color:var(--text-main);"><i class="bi bi-plus-circle-fill" style="color:var(--primary);"></i> Add New Product</h3>

        <form id="add-product-form">
          <div class="form-group">
            <label class="form-label">Product Name *</label>
            <input type="text" id="new-prod-name" class="form-input" required placeholder="e.g. Smart Watch Pro">
          </div>

          <div class="form-group">
            <label class="form-label">Department Category *</label>
            <select id="new-prod-cat" class="form-input" required>
              <option value="fashion">Fashion & Apparel</option>
              <option value="mobiles">Mobiles & Tech</option>
              <option value="furniture">Furniture & Living</option>
              <option value="groceries">Fresh Groceries</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Brand Name *</label>
            <input type="text" id="new-prod-brand" class="form-input" required placeholder="e.g. Srinivas Brand">
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.75rem;">
            <div class="form-group">
              <label class="form-label">Price (₹) *</label>
              <input type="number" id="new-prod-price" class="form-input" required placeholder="1499">
            </div>
            <div class="form-group">
              <label class="form-label">Original Price</label>
              <input type="number" id="new-prod-origprice" class="form-input" placeholder="2499">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Initial Stock *</label>
            <input type="number" id="new-prod-stock" class="form-input" required value="50">
          </div>

          <div class="form-group">
            <label class="form-label">Description</label>
            <textarea id="new-prod-desc" class="form-input" rows="3" placeholder="Enter key features and specs..."></textarea>
          </div>

          <button type="submit" class="btn-checkout" style="font-size:0.95rem;">Publish Product</button>
        </form>
      </div>

      <!-- Product Inventory Table -->
      <div class="cart-table-wrap">
        <div style="padding:1.25rem; background:var(--bg-subtle); border-bottom:1px solid var(--border-color); font-weight:800; font-size:1.1rem; color:var(--text-main);">
          Store Inventory Catalog
        </div>
        <table class="cart-table">
          <thead>
            <tr>
              <th>Product Info</th>
              <th>Department</th>
              <th>Price</th>
              <th>Stock Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="admin-inventory-body">
            <!-- Rendered by admin.js -->
          </tbody>
        </table>
      </div>

    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>

  <!-- Three.js 3D Library & Srinivas 3D Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/3d-engine.js"></script>
</body>

</html>
